{% extends 'base.html' %}

{% block title %}
Edit Product | Planet Accessories
{% endblock %}

{% block content %}

<section class="add-product-page">

    <div class="container">

        <div class="add-product-header">

            <div class="shop-subtitle">
                Product Management
            </div>

            <h1 class="shop-title">
                Edit Product
            </h1>

            <p>
                Update your product information.
            </p>

        </div>


        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="checkout-card">

                    <form
                        method="POST"
                        enctype="multipart/form-data"
                    >

                        {% csrf_token %}


                        <div class="mb-3">

                            <label>
                                Product Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="checkout-input"
                                value="{{ product.name }}"
                                required
                            >

                        </div>


                        <div class="management-field">

                            <label>
                                Category
                            </label>
                        
                            <select
                                name="category"
                                required
                            >
                        
                                {% for category in categories %}
                        
                                    <option
                                        value="{{ category.id }}"
                                        {% if product.category.id == category.id %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ category.name }}
                                    </option>
                        
                                {% endfor %}
                        
                            </select>
                        
                        </div>


                        <div class="mb-3">

                            <label>
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="checkout-input"
                                rows="4"
                            >{{ product.description }}</textarea>

                        </div>


                        <div class="mb-3">

                            <label>
                                Price
                            </label>

                            <input
                                type="number"
                                name="price"
                                class="checkout-input"
                                value="{{ product.price }}"
                                step="0.01"
                                min="0"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label>
                                Stock
                            </label>

                            <input
                                type="number"
                                name="stock"
                                class="checkout-input"
                                value="{{ product.stock }}"
                                min="0"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label>
                                Current Image
                            </label>

                            {% if product.image %}

                                <div style="margin-top: 10px; margin-bottom: 15px;">

                                    <img
                                        src="{{ product.image.url }}"
                                        alt="{{ product.name }}"
                                        style="width: 120px; height: 120px; object-fit: cover;"
                                    >

                                </div>

                            {% endif %}

                        </div>


                        <div class="mb-3">

                            <label>
                                Change Image
                            </label>

                            <input
                                type="file"
                                name="image"
                                class="form-control"
                                accept="image/*"
                            >

                        </div>


                        <div class="mb-3">

                            <label>

                                <input
                                    type="checkbox"
                                    name="is_new"
                                    {% if product.is_new %}
                                        checked
                                    {% endif %}
                                >

                                New Product

                            </label>

                        </div>


                        <div class="mb-4">

                            <label>

                                <input
                                    type="checkbox"
                                    name="is_active"
                                    {% if product.is_active %}
                                        checked
                                    {% endif %}
                                >

                                Product Active

                            </label>

                        </div>


                        <div class="management-actions">

                            <button
                                type="submit"
                                class="management-add-btn"
                            >
                                <i class="fa-solid fa-check"></i>
                                Save Changes
                            </button>

                            <a
                                href="{% url 'manage_products' %}"
                                class="edit-product-btn"
                            >
                                Cancel
                            </a>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
