{% extends 'base.html' %}

{% block title %}
Edit Category | Planet Accessories
{% endblock %}

{% block content %}

<section class="management-page">

    <div class="container">

        <div class="management-form-card">

            <div class="shop-subtitle">
                Management
            </div>

            <h1>
                Edit Category
            </h1>

            <p>
                Update the category information.
            </p>


            <form method="POST">

                {% csrf_token %}


                <div class="management-field">

                    <label>
                        Category Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        value="{{ category.name }}"
                        required
                    >

                </div>


                <div class="management-field">

                    <label>
                        Slug
                    </label>

                    <input
                        type="text"
                        name="slug"
                        value="{{ category.slug }}"
                        required
                    >

                </div>


                <div class="management-form-actions">

                    <a
                        href="{% url 'manage_categories' %}"
                        class="back-management-btn"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="management-add-btn"
                    >
                        <i class="fa-solid fa-check"></i>
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

</section>

{% endblock %}
